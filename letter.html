<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Letter</title>
		<link rel="stylesheet" href="let.css" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	</link>

	</head>
	<body>
		<div id="music">
							<img id="song-image" src="aln.png">
							<div id ="song-name"> Loving Machine</div>
							<div id="song-artist">TV Girl</div>
							<audio id="audio" ></audio>

							<input id="slider-song" type="range">
							<div id="music-buttons">
								<i class="fa-solid fa-shuffle"></i>
								<i class="fa-solid fa-backward-step fa-2x"></i>
								<i id="playpause" class="fa-solid fa-circle-play fa-3x"></i>
								<i class="fa-solid fa-forward-step fa-2x"></i>
								<i id="repeat" class="fa-solid fa-repeat"></i>

							</div>
		<center>
			<img id ="image" src="ily.png">
	
	
	</center>
	<script src="script.js"></script>
